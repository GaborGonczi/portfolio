<mat-card>
  <h1 class="mat-font-headline-lg">Technológiák</h1>
  <mat-card-content>
   <div class="technology-lists">
  <div>
    <h3 class="mat-font-title-lg">Fő stack</h3>
    <mat-list>
      @for (item of mainStack; track item.name) {
        <mat-list-item>
          <div class="technology-item">
            <mat-icon aria-hidden="false" [aria-label]="item.name" [svgIcon]="item.icon"></mat-icon
            ><span>{{ item.name }}</span>
          </div>
        </mat-list-item>
      }
    </mat-list>
  </div>
  <div>
    <h3 class="mat-font-title-lg">Egyéb</h3>
    <mat-list>
      @for (item of additionalTechnologies; track item.name) {
        <mat-list-item>
          <div class="technology-item">
            <mat-icon aria-hidden="false" [aria-label]="item.name" [svgIcon]="item.icon"></mat-icon
            ><span>{{ item.name }}</span>
          </div>
        </mat-list-item>
      }
    </mat-list>
  </div>
</div>

  </mat-card-content>
</mat-card>
